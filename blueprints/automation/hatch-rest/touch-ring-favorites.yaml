mode: single
max_exceeded: silent

trigger_variables:
  control_mode: !input control_mode

triggers:
  - trigger: event
    id: button_event
    enabled: "{{ control_mode == 'event' }}"
    event_type: esphome.hatch_button
    event_data:
      device: !input event_device_name
  - trigger: state
    id: legacy_touch
    enabled: "{{ control_mode == 'legacy' }}"
    entity_id: !input touch_sensor
    from: "off"
    to: "on"

variables:
  control_mode: !input control_mode
  touch_sensor: !input touch_sensor
  light_entity: !input light_entity
  media_player_entity: !input media_player_entity
  favorites: !input favorites
  start_from: !input start_from
  hold_time: !input hold_time
  lock_switch: !input lock_switch

conditions:
  - condition: template
    value_template: >-
      {{ (control_mode == 'event' and trigger.id == 'button_event')
         or (control_mode == 'legacy' and trigger.id == 'legacy_touch') }}
  - condition: template
    value_template: "{{ not lock_switch or not is_state(lock_switch, 'on') }}"

actions:
  - choose:
      - conditions: "{{ control_mode == 'event' }}"
        sequence:
          - choose:
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'touch' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input touch_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'touch' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input touch_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'touch' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input touch_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'touch' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input touch_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_up' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input volume_up_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_up' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input volume_up_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_up' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input volume_up_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_up' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input volume_up_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_down' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input volume_down_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_down' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input volume_down_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_down' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input volume_down_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'volume_down' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input volume_down_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_up' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input brightness_up_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_up' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input brightness_up_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_up' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input brightness_up_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_up' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input brightness_up_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_down' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input brightness_down_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_down' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input brightness_down_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_down' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input brightness_down_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'brightness_down' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input brightness_down_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'night_light' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input night_light_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'night_light' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input night_light_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'night_light' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input night_light_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'night_light' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input night_light_triple_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'bottom' and trigger.event.data.get('gesture') == 'tap' }}
                sequence: !input bottom_tap_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'bottom' and trigger.event.data.get('gesture') == 'hold' }}
                sequence: !input bottom_hold_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'bottom' and trigger.event.data.get('gesture') == 'double' }}
                sequence: !input bottom_double_action
              - conditions: >-
                  {{ trigger.event.data.get('button') == 'bottom' and trigger.event.data.get('gesture') == 'triple' }}
                sequence: !input bottom_triple_action
      - conditions: "{{ control_mode == 'legacy' }}"
        sequence:
          # Tap = released within hold_time. A template wait (not a trigger) also catches a release before this step runs.
          - wait_template: "{{ is_state(touch_sensor, 'off') }}"
            timeout:
              seconds: "{{ hold_time }}"
          - choose:
              # Hold: everything off.
              - conditions: "{{ not wait.completed }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ light_entity }}"
                  - action: media_player.media_stop
                    target:
                      entity_id: "{{ media_player_entity }}"
                    continue_on_error: true
              # Tap: next favorite.
              - conditions: "{{ favorites | count > 0 }}"
                sequence:
                  - variables:
                      # The favorite activated most recently: a scene's state is its last activation time, a script has
                      # last_triggered. -1 if none has been used yet.
                      last_index: >-
                        {% set ns = namespace(index=-1, ts=0) %}
                        {% for e in favorites %}
                          {% set t = as_timestamp(states(e) if e.startswith('scene.') else state_attr(e, 'last_triggered'), 0) %}
                          {% if t > ns.ts %}{% set ns.index = loop.index0 %}{% set ns.ts = t %}{% endif %}
                        {% endfor %}
                        {{ ns.index }}
                      all_off: >-
                        {{ not is_state(light_entity, 'on')
                           and states(media_player_entity) not in ['playing', 'buffering'] }}
                      next_index: >-
                        {% set n = favorites | count %}
                        {% if all_off and start_from == 'first' %}0
                        {% elif all_off and start_from == 'resume' %}{{ [last_index, 0] | max }}
                        {% else %}{{ (last_index + 1) % n }}{% endif %}
                      target_favorite: "{{ favorites[next_index | int] }}"
                  - if: "{{ target_favorite.startswith('scene.') }}"
                    then:
                      - action: scene.turn_on
                        target:
                          entity_id: "{{ target_favorite }}"
                    else:
                      - action: script.turn_on
                        target:
                          entity_id: "{{ target_favorite }}"
