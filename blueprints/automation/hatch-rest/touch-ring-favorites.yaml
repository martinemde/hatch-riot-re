blueprint:
  name: Hatch Rest touch ring favorites
  description: >-
    Replicates the stock Hatch Rest touch ring. **Tap** to cycle through a list of favorites (scenes or scripts that
    set the night light and speaker). **Touch and hold** to turn the light and sound off.


    Each tap activates the favorite after the one activated most recently, wrapping round at the end. While the light
    and speaker are both off, a tap instead starts from the first favorite (or resumes the last one, see below).
    Favorites are scenes or scripts: a scene can set the light and the speaker's volume and media; use a script for
    anything a scene can't do (e.g. play a sound on a loop).


    Legacy mode (the default) keeps this behavior. Event mode listens to esphome.hatch_button events
    for the configured device, button and gesture, ignores the raw touch sensor, and runs only the
    matching custom actions. Empty custom actions do nothing; they never fall back to favorites.
    Native firmware local tap/hold defaults run before Home Assistant receives the event. Event custom
    actions are additive unless native button mappings are changed separately in the firmware configuration.
    Legacy sensor, light, speaker, favorites, tap-when-off and hold-time inputs are unused in event mode.
    The optional lock switch gates Home Assistant actions in either mode; it does not undo native firmware actions.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/w1ll1am23/hatch-riot-re/blob/main/blueprints/automation/hatch-rest/touch-ring-favorites.yaml
  input:
    control_mode:
      name: Input mode
      description: Legacy uses the raw touch sensor and favorites. Event mode uses classified firmware button events only.
      default: legacy
      selector:
        select:
          options:
            - label: Legacy touch sensor / favorites
              value: legacy
            - label: Firmware button events / custom actions
              value: event
    event_device_name:
      name: Event device name
      description: Match the device field of esphome.hatch_button events (the ESPHome node name).
      default: hatch-plus
      selector:
        text:
    touch_sensor:
      name: Touch sensor
      description: Legacy mode only. The touch ring binary sensor (e.g. "Touch" on the Hatch Rest).
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
    light_entity:
      name: Light
      description: Legacy mode only. The night light. Turned off by a hold.
      default: []
      selector:
        entity:
          filter:
            - domain: light
    media_player_entity:
      name: Media player
      description: Legacy mode only. The speaker. Stopped by a hold.
      default: []
      selector:
        entity:
          filter:
            - domain: media_player
    favorites:
      name: Favorites
      description: Legacy mode only. Scenes or scripts to cycle through, in order.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [scene, script]
    start_from:
      name: Tap when off
      description: What a tap does while the light and speaker are both off.
      default: first
      selector:
        select:
          options:
            - label: Start from the first favorite
              value: first
            - label: Resume the last favorite used
              value: resume
            - label: Go to the next favorite
              value: next
    hold_time:
      name: Hold time
      description: How long the ring must be held to turn everything off (stock is 1 second).
      default: 1
      selector:
        number:
          min: 0.3
          max: 5
          step: 0.1
          unit_of_measurement: s
          mode: slider
    lock_switch:
      name: Lock switch (optional)
      description: Skip Home Assistant actions in either mode while this switch is on (e.g. "Toddler Lock").
      default: []
      selector:
        entity:
          filter:
            - domain: [switch, input_boolean]

    touch_tap_action:
      name: "Touch / short tap"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    touch_hold_action:
      name: "Touch / long press"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    touch_double_action:
      name: "Touch / double"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    touch_triple_action:
      name: "Touch / triple"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    volume_up_tap_action:
      name: "Volume up / short tap"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    volume_up_hold_action:
      name: "Volume up / long press"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    volume_up_double_action:
      name: "Volume up / double"
      description: Event mode only. Additional Home Assistant actions; native firmware actions have already run.
      default: []
      selector:
        action:
    volume_up_triple_action:
      name: "Volume up / triple"
