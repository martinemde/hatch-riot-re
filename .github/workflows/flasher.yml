name: Flasher tests
on:
  workflow_dispatch:
  push:
    paths: ['flasher/**', '.github/workflows/flasher.yml']
  pull_request:
    paths: ['flasher/**', '.github/workflows/flasher.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r flasher/requirements.txt
      - run: python -m unittest discover -s flasher -p 'test_*.py'
      - run: node flasher/test_dashboard.cjs
