# Hatch Rest (2nd gen, "RIoT" board) — ESPHome replacement for the stock firmware.
#
# Built on the hardware map confirmed with the probe firmware (../docs/hardware-map.md). RIoT only: RIoT+ (battery,
# GreenPAK power latch, wireless charging) is not supported.
#
# Flash ONLY after ../scripts/backup.sh has made and verified a full-flash backup.
#
# This is the shared base config. It needs the local components hatch_expander, hatch_display and hatch_status_led,
# which the top-level file provides via `external_components`:
#   hatch-rest.yaml          - local development (components from ./components)
#   hatch-rest-builder.yaml  - ESPHome Builder add-on (config and components from GitHub)

substitutions:
  name: hatch-rest
  friendly_name: Hatch Rest

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Append the last three MAC bytes (e.g. hatch-rest-a1b2c3) so several units on one network get unique names.
  name_add_mac_suffix: true
  comment: Hatch Rest 2nd gen running ESPHome
  on_boot:
    - priority: -100
      then:
        - script.execute: update_status_leds
        # The restored brightness / mode / text don't reach the display on their own at boot.
        - lambda: id(clock_display).set_brightness(15 - (uint8_t) id(display_brightness).state);
        - script.execute: update_display
        - lambda: id(sd_cache_source).set_enabled(id(sd_cache_enabled).state);

esp32:
  board: esp32dev
  # ESP32-WROVER-E-N16R8: 16 MB flash, 8 MB PSRAM.
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: update_status_leds
  on_client_disconnected:
    - script.execute: update_status_leds

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No ssid: the fallback AP takes the device name, MAC suffix included.
  ap:
    password: !secret fallback_ap_password
  on_connect:
    - script.execute: update_status_leds
  on_disconnect:
    - script.execute: update_status_leds

captive_portal:

# Bluetooth Wi-Fi setup (Improv), the stock "hold CONNECT" flow: when the device can't join Wi-Fi it advertises
# over BLE, and the Home Assistant app / improv-wifi.com can send it new credentials. Holding the bottom CONNECT
# button authorizes it for a minute. Only active while Wi-Fi is down, so it costs nothing in normal use.
esp32_ble:
  # Keep the Bluetooth host's buffers out of internal RAM (shared with Wi-Fi and the audio pipeline).
  use_psram: true

esp32_improv:
  authorizer: btn_bottom

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_display
    on_time:
      - seconds: 0
        then:
          - script.execute: update_display

# ---------------------------------------------------------------- Expander
# The expander gets the I2C pins to itself (bit-banged, see components/hatch_expander): no `i2c:` bus here. The
# accelerometer (0x27) on the same bus is unused by this config.
hatch_expander:
  - id: io_exp
    sda: GPIO0
    scl: GPIO22
    address: 0x58
    frequency: 50kHz
    interrupt_pin: GPIO34

# ---------------------------------------------------------------- Night light (LEDC, high-speed group)
power_supply:
  # LED driver enable (P1_0). Switching it on makes the expander NACK briefly; the component retries.
  - id: led_power
    pin:
      hatch_expander: io_exp
      number: 8
      mode: output
    enable_time: 30ms
    keep_on_time: 2s

output:
  # Colour order R, G, B, W confirmed on hardware; max_power = the stock firmware's own caps (0x4013a330).
  - platform: ledc
    id: ch_r
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    frequency: 19500Hz
    max_power: 50%
    power_supply: led_power
  - platform: ledc
    id: ch_g
    pin: GPIO18
    frequency: 19500Hz
    max_power: 37.5%
    power_supply: led_power
  - platform: ledc
    id: ch_b
    pin: GPIO19
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power
  - platform: ledc
    id: ch_w
    pin: GPIO4
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power

light:
  - platform: rgbw
    id: night_light
    name: Night Light
    red: ch_r
    green: ch_g
    blue: ch_b
    white: ch_w
    color_interlock: false
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

# ---------------------------------------------------------------- Audio (I2S -> mono class-D amp)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO21
    # The amp is mono (hardware ID 0 -> 1 channel); stock uses the right slot for mono.
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

# Music Assistant streams over Sendspin; Home Assistant URLs (TTS, media) come in over HTTP. All feed one media
# pipeline on the I2S speaker. Web URLs go through sd_cache: with "SD Card Cache" on, repeated sounds play from the
# card and new ones are saved to it as they play; off (or no card), it just streams. audio_http is the fallback if
# sd_cache is busy.
sendspin:
  id: sendspin_hub

media_source:
  - platform: sd_cache
    id: sd_cache_source
    power_pin:
      hatch_expander: io_exp
      number: 9
      mode: output
  - platform: audio_http
    id: http_source
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: speaker_source
    id: player
    name: Speaker
    volume_initial: 0.3
    media_pipeline:
      # No resampler: under Wi-Fi load it couldn't keep up and audio slowed by ~25-35%. Sources send their native
      # rate; sd_cache sends mono as stereo, because 16-bit mono at 44.1 kHz plays at half speed on this I2S speaker.
      speaker: spk
      sources:
        - sd_cache_source
        - http_source
        - sendspin_source
      # Ask Home Assistant for the original media URL, not a transcoding-proxy URL: the proxy URL is new on every
      # play, so nothing would ever be found in the cache. The device decodes MP3, FLAC and WAV itself.
      format: NONE
    # Amp follows the player: on once the I2S clocks are running (enabling it first caused a loud pop), off 2 s
    # after going idle.
    on_state:
      - if:
          condition:
            media_player.is_idle: player
          then:
            - delay: 2s
            - if:
                condition:
                  media_player.is_idle: player
                then:
                  - switch.turn_off: amp
          else:
            - script.execute: amp_on_after_clocks

switch:
  # Amp enable (P1_2): on only while playing. Silent when off, confirmed on hardware.
  - platform: gpio
    id: amp
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      hatch_expander: io_exp
      number: 10
      mode: output
  # Touch controller enable (P0_5), on like stock. Needs P0 push-pull (the expander component sets it).
  - platform: gpio
    id: touch_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      hatch_expander: io_exp
      number: 5
      mode: output
  # Cache web audio on the SD card. Off: the card is unmounted and powered down, and everything streams.
  - platform: template
    id: sd_cache_enabled
    name: SD Card Cache
    icon: mdi:sd
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(sd_cache_source).set_enabled(true);
    on_turn_off:
      - lambda: id(sd_cache_source).set_enabled(false);
  # Toddler lock: ignore the hardware buttons. Shown green in the lock window.
  - platform: template
    id: toddler_lock
    name: Toddler Lock
    icon: mdi:lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: update_status_leds
    on_turn_off:
      - script.execute: update_status_leds
  # Display mode: on = clock, off = the "Display Text" entity.
  - platform: template
    id: show_clock
    name: Show Clock
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: update_display
    on_turn_off:
      - script.execute: update_display

# ---------------------------------------------------------------- Buttons
binary_sensor:
  - platform: gpio
    id: btn_volume_up
    name: Volume Up Button
    pin: {hatch_expander: io_exp, number: 0, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - if:
                condition: {binary_sensor.is_on: touch}
                then:
                  - script.execute: {id: play_cached_audio, step: 1}
                else:
                  - media_player.volume_up: player
  - platform: gpio
    id: btn_brightness_up
    name: Brightness Up Button
    pin: {hatch_expander: io_exp, number: 1, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - if:
                condition: {binary_sensor.is_on: touch}
                then:
                  - script.execute: {id: adjust_white_warmth, step: 0.02}
                else:
                  - light.dim_relative:
                      id: night_light
                      relative_brightness: 10%
  - platform: gpio
    id: btn_night_light
    name: Night Light Button
    pin: {hatch_expander: io_exp, number: 2, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - if:
                condition: {binary_sensor.is_on: touch}
                then:
                  - script.execute: cycle_night_light_colour
                else:
                  - light.toggle: night_light
  - platform: gpio
    id: btn_volume_down
    name: Volume Down Button
    pin: {hatch_expander: io_exp, number: 3, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - if:
                condition: {binary_sensor.is_on: touch}
                then:
                  - script.execute: {id: play_cached_audio, step: -1}
                else:
                  - media_player.volume_down: player
  - platform: gpio
    id: btn_brightness_down
    name: Brightness Down Button
    pin: {hatch_expander: io_exp, number: 4, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - if:
                condition: {binary_sensor.is_on: touch}
                then:
                  - script.execute: {id: adjust_white_warmth, step: -0.02}
                else:
                  - light.dim_relative:
                      id: night_light
                      relative_brightness: -10%
  # Top touch (touch controller output, active high). Debounced: a touch must last 50 ms to count (drops noise
  # spikes), and short dropouts while held are bridged so a hold isn't split into a tap plus a new touch.
  # Held, it changes what the front buttons do (touch first, then the button):
  #   night light (hold) = cycle colours, brightness up / down (hold) = warmer / cooler white,
  #   volume up / down = next / previous file in the SD card cache.
  - platform: gpio
    id: touch
    name: Touch
    pin: GPIO33
    filters:
      - delayed_on: 50ms
      - delayed_off: 100ms
  # Bottom "CONNECT" button (active low). Stock: hold >2 s = Bluetooth setup; exposed to Home Assistant here.
  # A short press shows the status LEDs for 30 s (works with the toddler lock on: it only shows status).
  - platform: gpio
    id: btn_bottom
    name: Bottom Button
    pin:
      number: GPIO36
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 1500ms
        then:
          - script.execute: show_status_leds

globals:
  # Where the night light colour cycle is on the colour wheel (degrees).
  - id: night_light_hue
    type: int
    initial_value: '0'

# ---------------------------------------------------------------- Clock display (display MCU over UART1)
uart:
  id: disp_uart
  tx_pin: GPIO27
  baud_rate: 19200
  data_bits: 8
  parity: ODD
  stop_bits: 1

hatch_display:
  id: clock_display
  uart_id: disp_uart
  brightness: 4

number:
  - platform: template
    id: display_brightness
    name: Display Brightness
    icon: mdi:brightness-6
    # 0 = off, 15 = brightest. The display's own scale runs the other way (0 = brightest), so it is inverted here.
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 11
    set_action:
      - lambda: id(clock_display).set_brightness(15 - (uint8_t) x);

text:
  # Shown while "Show Clock" is off: up to 4 characters, right-aligned; a '.' lights the previous digit's decimal
  # point (e.g. "12.5", "HI", "-3.2.1"). Letters use the stock 7-segment font, so some read better than others.
  - platform: template
    id: display_text
    name: Display Text
    icon: mdi:form-textbox
    mode: text
    max_length: 8
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_display

script:
  # Enable the amp only after the I2S speaker is running, so the amp starts with its clocks present.
  - id: amp_on_after_clocks
    mode: single
    then:
      - if:
          condition:
            switch.is_off: amp
          then:
            - wait_until:
                condition:
                  speaker.is_playing: spk
                timeout: 1s
            - delay: 30ms
            - switch.turn_on: amp
  # Clock or custom text, per the "Show Clock" switch.
  - id: update_display
    mode: queued
    then:
      - lambda: |-
          if (!id(show_clock).state) {
            id(clock_display).show_text(id(display_text).state);
            return;
          }
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int h = t.hour % 12;
          if (h == 0) h = 12;
          id(clock_display).show_time(h, t.minute);

  # Status LEDs stay dark (like stock, which only shows them when tipped over) until show_status_leds runs.
  # Wi-Fi window: green = connected to Home Assistant, amber = Wi-Fi only, red = no Wi-Fi.
  # Lock window: green while the toddler lock is on.
  - id: update_status_leds
    mode: restart
    then:
      - lambda: |-
          if (!id(show_status_leds).is_running()) {
            id(status_leds).set(hatch_status_led::WINDOW_WIFI, hatch_status_led::COLOUR_OFF);
            id(status_leds).set(hatch_status_led::WINDOW_LOCK, hatch_status_led::COLOUR_OFF);
            return;
          }
          uint8_t wifi;
          if (!wifi::global_wifi_component->is_connected()) wifi = hatch_status_led::COLOUR_RED;
          else if (api::global_api_server->is_connected()) wifi = hatch_status_led::COLOUR_GREEN;
          else wifi = hatch_status_led::COLOUR_AMBER;
          id(status_leds).set(hatch_status_led::WINDOW_WIFI, wifi);
          id(status_leds).set(hatch_status_led::WINDOW_LOCK,
                              id(toddler_lock).state ? hatch_status_led::COLOUR_GREEN : hatch_status_led::COLOUR_OFF);
  # Show the status LEDs for 30 s; another press restarts the timer. Changes while shown update them live.
  - id: show_status_leds
    mode: restart
    then:
      - script.execute: update_status_leds
      - delay: 30s
      - lambda: |-
          id(status_leds).set(hatch_status_led::WINDOW_WIFI, hatch_status_led::COLOUR_OFF);
          id(status_leds).set(hatch_status_led::WINDOW_LOCK, hatch_status_led::COLOUR_OFF);

  # Touch ring + night light button held: sweep the night light around the colour wheel (white off), about 6 s per
  # turn, from the current colour. It stops on the colour it's at when either is released.
  - id: cycle_night_light_colour
    mode: single
    then:
      - lambda: |-
          auto &v = id(night_light).remote_values;
          float s, val;
          rgb_to_hsv(v.get_red(), v.get_green(), v.get_blue(), id(night_light_hue), s, val);
      - while:
          condition:
            lambda: return id(touch).state && id(btn_night_light).state;
          then:
            - lambda: |-
                id(night_light_hue) = (id(night_light_hue) + 3) % 360;
                float r, g, b;
                hsv_to_rgb(id(night_light_hue), 1.0f, 1.0f, r, g, b);
                auto call = id(night_light).turn_on();
                call.set_rgb(r, g, b);
                call.set_color_brightness(1.0f);
                call.set_white(0.0f);
                call.set_transition_length(0);
                call.perform();
            - delay: 50ms
  # Touch ring + brightness up / down held: make the white light warmer / cooler (full range in 2.5 s), stopping on
  # release. The LEDs have a single white channel, so warmth is amber from the red and green LEDs mixed into it:
  # none = plain white, full = amber at full strength.
  - id: adjust_white_warmth
    mode: single
    parameters:
      step: float
    then:
      - while:
          condition:
            lambda: |-
              return id(touch).state && (step > 0 ? id(btn_brightness_up).state : id(btn_brightness_down).state);
          then:
            - lambda: |-
                auto &v = id(night_light).remote_values;
                float warmth = v.get_white() > 0.0f ? v.get_color_brightness() : 0.0f;
                auto call = id(night_light).turn_on();
                call.set_rgb(1.0f, 0.4f, 0.0f);
                call.set_color_brightness(clamp(warmth + step, 0.0f, 1.0f));
                call.set_white(1.0f);
                call.set_transition_length(0);
                call.perform();
            - delay: 50ms
  # Touch ring + volume up / down: play the next / previous file in the SD card cache. The order is by file name,
  # which is a hash of the URL, so effectively random but fixed. Does nothing with the cache off or empty.
  - id: play_cached_audio
    mode: single
    parameters:
      step: int
    then:
      - lambda: |-
          auto uri = id(sd_cache_source).cached_uri(step);
          if (!uri.empty())
            id(player).make_call().set_media_url(uri).perform();

hatch_status_led:
  id: status_leds

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: template
    name: SD Cache Used
    icon: mdi:sd
    unit_of_measurement: MB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(sd_cache_source).cache_used_mb();
  - platform: template
    name: SD Cache Files
    icon: mdi:file-music
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(sd_cache_source).cache_files();

button:
  - platform: restart
    name: Restart
  - platform: template
    name: Clear SD Cache
    icon: mdi:delete-sweep
    entity_category: config
    on_press:
      - lambda: id(sd_cache_source).clear_cache();
