# Hatch Rest (2nd gen, "RIoT" board) — ESPHome replacement for the stock firmware.
#
# Built on the hardware map confirmed with the probe firmware (../docs/hardware-map.md). RIoT only: RIoT+ (battery,
# GreenPAK power latch, wireless charging) is not supported.
#
# Flash ONLY after ../scripts/backup.sh has made and verified a full-flash backup.
#
# This is the shared base config. It needs the local components hatch_expander, hatch_buttons, hatch_display,
# hatch_scenes and hatch_status_led, which the top-level file provides via `external_components`:
#   hatch-rest.yaml          - local development (components from ./components)
#   hatch-rest-builder.yaml  - ESPHome Builder add-on (config and components from GitHub)

substitutions:
  name: hatch-rest
  friendly_name: Hatch Rest

# The buttons and touch ring are wired as on the Rest+, so both share its controls: local actions and a Home
# Assistant event entity per control.
packages:
  controls: !include hatch-plus-controls.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Append the last three MAC bytes (e.g. hatch-rest-a1b2c3) so several units on one network get unique names.
  name_add_mac_suffix: true
  comment: Hatch Rest 2nd gen running ESPHome
  on_boot:
    - priority: -100
      then:
        - script.execute: update_status_leds
        # The restored mode / text don't reach the display on their own at boot.
        - script.execute: update_display
        - lambda: id(sd_cache_source).set_enabled(id(sd_cache_enabled).state);

esp32:
  board: esp32dev
  # ESP32-WROVER-E-N16R8: 16 MB flash, 8 MB PSRAM.
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true

psram:
  mode: quad
  speed: 80MHz

logger:

# Saved settings (volume, selects, switches) are written to flash in one batch per interval. A write can stall audio for
# over a second (Sendspin lost sync on each one), so batch them less often. Changes from the last 5 min before a power
# cut are lost.
preferences:
  flash_write_interval: 5min

api:
  encryption:
    key: !secret api_encryption_key
  # Stay up without Home Assistant or Wi-Fi: the buttons, scenes and fallback AP keep working.
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: update_status_leds
  on_client_disconnected:
    - script.execute: update_status_leds
  actions:
    # Scroll a message across the clock once (e.g. from a HA automation), then restore what was shown.
    - action: send_text
      variables:
        message: string
      then:
        - lambda: id(clock_display).show_scrolling_text_once(message);
    # Scenes by slot number (1-9); see ../docs/hatch-scenes.md.
    - action: save_scene
      variables:
        slot: int
      then:
        - hatch_scenes.save:
            slot: !lambda return slot;
    - action: load_scene
      variables:
        slot: int
      then:
        - hatch_scenes.load: !lambda return slot;
    - action: delete_scene
      variables:
        slot: int
      then:
        - hatch_scenes.delete:
            slot: !lambda return slot;
    - action: next_scene
      then:
        - hatch_scenes.next: scenes
    - action: previous_scene
      then:
        - hatch_scenes.previous: scenes

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Radio always on: light sleep (the ESP32 default) delays and bunches packets, and Sendspin loses sync (stutter).
  # Mains powered, so the extra draw doesn't matter.
  power_save_mode: none
  reboot_timeout: 0s
  # No ssid: the fallback AP takes the device name, MAC suffix included.
  ap:
    password: !secret fallback_ap_password
  on_connect:
    - script.execute: update_status_leds
  on_disconnect:
    - script.execute: update_status_leds

captive_portal:

# Bluetooth Wi-Fi setup (Improv), the stock "hold CONNECT" flow: when the device can't join Wi-Fi it advertises
# over BLE, and the Home Assistant app / improv-wifi.com can send it new credentials. Holding the bottom CONNECT
# button authorizes it for a minute. Only active while Wi-Fi is down, so it costs nothing in normal use.
esp32_ble:
  # Keep the Bluetooth host's buffers out of internal RAM (shared with Wi-Fi and the audio pipeline).
  use_psram: true

improv_ble:
  authorizer: btn_bottom

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_display
    on_time:
      - seconds: 0
        then:
          - script.execute: update_display

# ---------------------------------------------------------------- Expander
# The expander gets the I2C pins to itself (bit-banged, see components/hatch_expander): no `i2c:` bus here. The
# accelerometer shares that bus through the expander component (see below).
hatch_expander:
  - id: io_exp
    sda: GPIO0
    scl: GPIO22
    address: 0x58
    frequency: 50kHz
    interrupt_pin: GPIO34

# ---------------------------------------------------------------- Accelerometer
# DA213 (0x27) or MSA311 (0x62) on the expander's bus, auto-detected. See ../docs/hatch-accelerometer.md.
hatch_accelerometer:
  id: hatch_accel
  hatch_expander_id: io_exp
  tilt_angle:
    name: Tilt Angle
    filters:
      - delta: 2.0
  upright:
    name: Upright
  acceleration_x:
    name: Acceleration X
    disabled_by_default: true
  acceleration_y:
    name: Acceleration Y
    disabled_by_default: true
  acceleration_z:
    name: Acceleration Z
    disabled_by_default: true

# ---------------------------------------------------------------- Night light (LEDC, high-speed group)
power_supply:
  # LED driver enable (P1_0). Switching it on makes the expander NACK briefly; the component retries.
  - id: led_power
    pin:
      hatch_expander: io_exp
      number: 8
      mode: output
    enable_time: 30ms
    keep_on_time: 2s

output:
  # Colour order R, G, B, W confirmed on hardware; max_power = the stock firmware's own caps (0x4013a330).
  - platform: ledc
    id: ch_r
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    frequency: 19500Hz
    max_power: 50%
    power_supply: led_power
  - platform: ledc
    id: ch_g
    pin: GPIO18
    frequency: 19500Hz
    max_power: 37.5%
    power_supply: led_power
  - platform: ledc
    id: ch_b
    pin: GPIO19
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power
  - platform: ledc
    id: ch_w
    pin: GPIO4
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power
  # Clock Display brightness. The display's own scale runs the other way (0 = brightest, 15 = off).
  - platform: template
    id: clock_brightness_output
    type: float
    write_action:
      - lambda: |-
          const auto level = static_cast<uint8_t>(roundf(state * 15.0f));
          id(clock_display).set_brightness(15 - level);

light:
  - platform: monochromatic
    id: clock_light
    name: Clock Display
    icon: mdi:clock-digital
    output: clock_brightness_output
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    # Level 11 of 15, the old Display Brightness default.
    initial_state:
      brightness: 73.3333%
  - platform: rgbw
    id: night_light
    name: Night Light
    red: ch_r
    green: ch_g
    blue: ch_b
    white: ch_w
    color_interlock: false
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

# ---------------------------------------------------------------- Audio (I2S -> mono class-D amp)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO21
    # The amp is mono (hardware ID 0 -> 1 channel); stock uses the right slot for mono.
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

# Music Assistant streams over Sendspin; Home Assistant URLs (TTS, media) come in over HTTP. All feed one media
# pipeline on the I2S speaker. Web URLs go through sd_cache: with "SD Card Cache" on, repeated sounds play from the
# card and new ones are saved to it as they play; off (or no card), it just streams. audio_http is the fallback if
# sd_cache is busy.
sendspin:
  id: sendspin_hub

media_source:
  - platform: sd_cache
    id: sd_cache_source
    power_pin:
      hatch_expander: io_exp
      number: 9
      mode: output
    # Read-only browsing of the stock sound directories on the card (hatch-library:// URIs). The cache itself
    # stays inside its own directory; stock files are never written or evicted.
    library_enabled: true
  - platform: audio_http
    id: http_source
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: speaker_source
    id: player
    name: Speaker
    volume_initial: 0.3
    media_pipeline:
      # No resampler: under Wi-Fi load it couldn't keep up and audio slowed by ~25-35%. Sources send their native
      # rate; sd_cache sends mono as stereo, because 16-bit mono at 44.1 kHz plays at half speed on this I2S speaker.
      speaker: spk
      sources:
        - sd_cache_source
        - http_source
        - sendspin_source
      # Ask Home Assistant for the original media URL, not a transcoding-proxy URL: the proxy URL is new on every
      # play, so nothing would ever be found in the cache. The device decodes MP3, FLAC and WAV itself.
      format: NONE
    # Sendspin only leaves its group while the group is playing, so a local play (Home Assistant play_media, Stock
    # Sound) while Music Assistant still holds the speaker would wait on it. Ask Music Assistant to stop instead: the
    # stream ends and Sendspin goes idle. Don't disconnect: a user_request goodbye makes MA mark the player unavailable
    # and never reconnect.
    on_play_uri:
      - lambda: |-
          if (x.rfind("sendspin://", 0) != 0 &&
              id(sendspin_source).get_state() != media_source::MediaSourceState::IDLE) {
            id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::STOP);
          }
    # Amp follows the player: on once the I2S clocks are running (enabling it first caused a loud pop), off 2 s
    # after going idle.
    on_state:
      - if:
          condition:
            media_player.is_idle: player
          then:
            - delay: 2s
            - if:
                condition:
                  media_player.is_idle: player
                then:
                  - switch.turn_off: amp
          else:
            - script.execute: amp_on_after_clocks

select:
  # The stock sounds on the card, playable again without the Hatch app. Picking one loops it (Loop Sound);
  # "None" stops playback. The file list matches the stock card layout (Rest_Sounds/wav).
  - platform: template
    id: stock_sound
    name: Stock Sound
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    initial_option: None
    options:
      - None
      - Heartbeat
      - Stream
      - Pink Noise
      - Dryer
      - Ocean
      - Wind
      - Rain
      - Birds
      - Crickets
      - Brahms
      - Twinkle
      - Rockabye
    set_action:
      - lambda: |-
          if (x == "None") {
            id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP).perform();
            return;
          }
          std::string filename;
          if (x == "Heartbeat") filename = "001_heartbeat.wav";
          if (x == "Stream") filename = "002_waterstreamsmallclose16.wav";
          if (x == "Pink Noise") filename = "003_pinknoise16.wav";
          if (x == "Dryer") filename = "004_dryerclothes16.wav";
          if (x == "Ocean") filename = "005_oceanwaves16.wav";
          if (x == "Wind") filename = "006_wind16.wav";
          if (x == "Rain") filename = "007_rain16.wav";
          if (x == "Birds") filename = "009_birdschorus16.wav";
          if (x == "Crickets") filename = "010_crickets16.wav";
          if (x == "Brahms") filename = "011_brahms16.wav";
          if (x == "Twinkle") filename = "013_twinkle16.wav";
          if (x == "Rockabye") filename = "014_rockabye16.wav";
          if (filename.empty()) return;
          id(loop_sound).turn_on();
          id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_ONE).perform();
          id(player).make_call().set_media_url("hatch-library:///Rest_Sounds/wav/" + filename).perform();

switch:
  # Repeats the current track (used by the Stock Sound select, but works for any source).
  - platform: template
    id: loop_sound
    name: Loop Sound
    icon: mdi:repeat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_ONE).perform();
    on_turn_off:
      - lambda: id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_OFF).perform();

  # Amp enable (P1_2): on only while playing. Silent when off, confirmed on hardware.
  - platform: gpio
    id: amp
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      hatch_expander: io_exp
      number: 10
      mode: output
  # Touch controller enable (P0_5), on like stock. Needs P0 push-pull (the expander component sets it).
  - platform: gpio
    id: touch_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      hatch_expander: io_exp
      number: 5
      mode: output
  # Cache web audio on the SD card. Off: the card is unmounted and powered down, and everything streams.
  - platform: template
    id: sd_cache_enabled
    name: SD Card Cache
    icon: mdi:sd
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(sd_cache_source).set_enabled(true);
    on_turn_off:
      - lambda: id(sd_cache_source).set_enabled(false);
  # Toddler lock (from the controls): shown green in the lock window.
  - id: !extend toddler_lock
    icon: mdi:lock
    on_state:
      - script.execute: update_status_leds
  # Display mode: on = clock, off = the "Display Text" entity.
  - platform: template
    id: show_clock
    name: Show Clock
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: update_display
    on_turn_off:
      - script.execute: update_display

# ---------------------------------------------------------------- Buttons
binary_sensor:
  # Bottom "CONNECT" button (from the controls). Stock: hold >2 s = Bluetooth setup (Improv, above).
  # A short press shows the status LEDs for 30 s. It bypasses the button classifier, so it also works with the
  # toddler lock on: it only shows status.
  - id: !extend btn_bottom
    on_click:
      - min_length: 50ms
        max_length: 1500ms
        then:
          - script.execute: show_status_leds

# ---------------------------------------------------------------- Clock display (display MCU over UART1)
uart:
  id: disp_uart
  tx_pin: GPIO27
  baud_rate: 19200
  data_bits: 8
  parity: ODD
  stop_bits: 1

hatch_display:
  id: clock_display
  uart_id: disp_uart
  brightness: 4

# Saved night light + sound in slots 1-9, confirmed on the clock (SAV1, FAV1, DEL1). See ../docs/hatch-scenes.md.
hatch_scenes:
  id: scenes
  light_id: night_light
  media_player_id: player
  display_id: clock_display

text:
  # Shown while "Show Clock" is off. Text longer than four glyphs scrolls (500 ms steps, first and last frames
  # held for 2 s). A '.' lights the previous digit's decimal point (e.g. "12.5", "HI", "-3.2.1"). Letters use the
  # stock 7-segment font, so some read better than others.
  - platform: template
    id: display_text
    name: Display Text
    icon: mdi:form-textbox
    mode: text
    max_length: 128
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_display

script:
  # Enable the amp only after the I2S speaker is running, so the amp starts with its clocks present.
  - id: amp_on_after_clocks
    mode: single
    then:
      - if:
          condition:
            switch.is_off: amp
          then:
            - wait_until:
                condition:
                  speaker.is_playing: spk
                timeout: 1s
            - delay: 30ms
            - switch.turn_on: amp
  # Clock or custom text, per the "Show Clock" switch.
  - id: update_display
    mode: queued
    then:
      - lambda: |-
          if (!id(show_clock).state) {
            id(clock_display).show_scrolling_text(id(display_text).state);
            return;
          }
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int h = t.hour % 12;
          if (h == 0) h = 12;
          id(clock_display).show_time(h, t.minute);

  # Status LEDs stay dark (like stock, which only shows them when tipped over) until show_status_leds runs.
  # Wi-Fi window: green = connected to Home Assistant, amber = Wi-Fi only, red = no Wi-Fi.
  # Lock window: green while the toddler lock is on.
  - id: update_status_leds
    mode: restart
    then:
      - lambda: |-
          if (!id(show_status_leds).is_running()) {
            id(status_leds).set(hatch_status_led::WINDOW_WIFI, hatch_status_led::COLOUR_OFF);
            id(status_leds).set(hatch_status_led::WINDOW_LOCK, hatch_status_led::COLOUR_OFF);
            return;
          }
          uint8_t wifi;
          if (!wifi::global_wifi_component->is_connected()) wifi = hatch_status_led::COLOUR_RED;
          else if (api::global_api_server->is_connected()) wifi = hatch_status_led::COLOUR_GREEN;
          else wifi = hatch_status_led::COLOUR_AMBER;
          id(status_leds).set(hatch_status_led::WINDOW_WIFI, wifi);
          id(status_leds).set(hatch_status_led::WINDOW_LOCK,
                              id(toddler_lock).state ? hatch_status_led::COLOUR_GREEN : hatch_status_led::COLOUR_OFF);
  # Show the status LEDs for 30 s; another press restarts the timer. Changes while shown update them live.
  - id: show_status_leds
    mode: restart
    then:
      - script.execute: update_status_leds
      - delay: 30s
      - lambda: |-
          id(status_leds).set(hatch_status_led::WINDOW_WIFI, hatch_status_led::COLOUR_OFF);
          id(status_leds).set(hatch_status_led::WINDOW_LOCK, hatch_status_led::COLOUR_OFF);

hatch_status_led:
  id: status_leds

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: template
    name: SD Cache Used
    icon: mdi:sd
    unit_of_measurement: MB
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(sd_cache_source).cache_used_mb();
  - platform: template
    name: SD Cache Files
    icon: mdi:file-music
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(sd_cache_source).cache_files();

button:
  - platform: restart
    name: Restart
  - platform: template
    name: Clear SD Cache
    icon: mdi:delete-sweep
    entity_category: config
    on_press:
      - lambda: id(sd_cache_source).clear_cache();
