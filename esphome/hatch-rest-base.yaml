# Hatch Rest (2nd gen, "RIoT" board) — ESPHome replacement for the stock firmware.
#
# Built on the hardware map confirmed with the probe firmware (../docs/hardware-map.md). RIoT only: RIoT+ (battery,
# GreenPAK power latch, wireless charging) is not supported.
#
# Flash ONLY after ../scripts/backup.sh has made and verified a full-flash backup.
#
# This is the shared base config. It needs the local components hatch_expander, hatch_display and hatch_status_led,
# which the top-level file provides via `external_components`:
#   hatch-rest.yaml          - local development (components from ./components)
#   hatch-rest-builder.yaml  - ESPHome Builder add-on (config and components from GitHub)

substitutions:
  name: hatch-rest
  friendly_name: Hatch Rest

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Hatch Rest 2nd gen running ESPHome
  on_boot:
    - priority: -100
      then:
        - script.execute: update_status_leds

esp32:
  board: esp32dev
  # ESP32-WROVER-E-N16R8: 16 MB flash, 8 MB PSRAM.
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true

psram:
  mode: quad
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: update_status_leds
  on_client_disconnected:
    - script.execute: update_status_leds

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Hatch Rest Fallback"
    password: !secret fallback_ap_password
  on_connect:
    - script.execute: update_status_leds
  on_disconnect:
    - script.execute: update_status_leds

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: show_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: show_clock

# ---------------------------------------------------------------- Expander
# The expander gets the I2C pins to itself (bit-banged, see components/hatch_expander): no `i2c:` bus here. The
# accelerometer (0x27) on the same bus is unused by this config.
hatch_expander:
  - id: io_exp
    sda: GPIO0
    scl: GPIO22
    address: 0x58
    frequency: 50kHz
    interrupt_pin: GPIO34

# ---------------------------------------------------------------- Night light (LEDC, high-speed group)
power_supply:
  # LED driver enable (P1_0). Switching it on makes the expander NACK briefly; the component retries.
  - id: led_power
    pin:
      hatch_expander: io_exp
      number: 8
      mode: output
    enable_time: 30ms
    keep_on_time: 2s

output:
  # Colour order R, G, B, W confirmed on hardware; max_power = the stock firmware's own caps (0x4013a330).
  - platform: ledc
    id: ch_r
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    frequency: 19500Hz
    max_power: 50%
    power_supply: led_power
  - platform: ledc
    id: ch_g
    pin: GPIO18
    frequency: 19500Hz
    max_power: 37.5%
    power_supply: led_power
  - platform: ledc
    id: ch_b
    pin: GPIO19
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power
  - platform: ledc
    id: ch_w
    pin: GPIO4
    frequency: 19500Hz
    max_power: 25%
    power_supply: led_power

light:
  - platform: rgbw
    id: night_light
    name: Night Light
    red: ch_r
    green: ch_g
    blue: ch_b
    white: ch_w
    color_interlock: false
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

# ---------------------------------------------------------------- Audio (I2S -> mono class-D amp)
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO21
    # The amp is mono (hardware ID 0 -> 1 channel); stock uses the right slot for mono.
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

# Music Assistant streams over Sendspin; Home Assistant URLs (TTS, media) come in over HTTP. Both feed one media
# pipeline on the I2S speaker.
sendspin:
  id: sendspin_hub

media_source:
  - platform: audio_http
    id: http_source
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: speaker_source
    id: player
    name: Speaker
    volume_initial: 0.3
    media_pipeline:
      speaker: spk
      sources:
        - http_source
        - sendspin_source
      num_channels: 1
    # Amp follows the player: on once the I2S clocks are running (enabling it first caused a loud pop), off 2 s
    # after going idle.
    on_state:
      - if:
          condition:
            media_player.is_idle: player
          then:
            - delay: 2s
            - if:
                condition:
                  media_player.is_idle: player
                then:
                  - switch.turn_off: amp
          else:
            - script.execute: amp_on_after_clocks

rtttl:
  id: chime
  speaker: spk
  gain: 25%

switch:
  # Amp enable (P1_2): on only while playing. Silent when off, confirmed on hardware.
  - platform: gpio
    id: amp
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      hatch_expander: io_exp
      number: 10
      mode: output
  # Touch controller enable (P0_5), on like stock. Needs P0 push-pull (the expander component sets it).
  - platform: gpio
    id: touch_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      hatch_expander: io_exp
      number: 5
      mode: output
  # Toddler lock: ignore the hardware buttons. Shown green in the lock window.
  - platform: template
    id: toddler_lock
    name: Toddler Lock
    icon: mdi:lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: update_status_leds
    on_turn_off:
      - script.execute: update_status_leds

# ---------------------------------------------------------------- Buttons
binary_sensor:
  - platform: gpio
    id: btn_volume_up
    name: Volume Up Button
    pin: {hatch_expander: io_exp, number: 0, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - media_player.volume_up: player
  - platform: gpio
    id: btn_brightness_up
    name: Brightness Up Button
    pin: {hatch_expander: io_exp, number: 1, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - light.dim_relative:
                id: night_light
                relative_brightness: 10%
  - platform: gpio
    id: btn_night_light
    name: Night Light Button
    pin: {hatch_expander: io_exp, number: 2, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - light.toggle: night_light
  - platform: gpio
    id: btn_volume_down
    name: Volume Down Button
    pin: {hatch_expander: io_exp, number: 3, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - media_player.volume_down: player
  - platform: gpio
    id: btn_brightness_down
    name: Brightness Down Button
    pin: {hatch_expander: io_exp, number: 4, mode: input, inverted: true}
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition: {switch.is_off: toddler_lock}
          then:
            - light.dim_relative:
                id: night_light
                relative_brightness: -10%
  # Top touch (touch controller output, active high).
  - platform: gpio
    id: touch
    name: Touch
    pin: GPIO33
  # Bottom "CONNECT" button (active low). Stock: hold >2 s = Bluetooth setup; exposed to Home Assistant here.
  - platform: gpio
    id: btn_bottom
    name: Bottom Button
    pin:
      number: GPIO36
      inverted: true

# ---------------------------------------------------------------- Clock display (display MCU over UART1)
uart:
  id: disp_uart
  tx_pin: GPIO27
  baud_rate: 19200
  data_bits: 8
  parity: ODD
  stop_bits: 1

hatch_display:
  id: clock_display
  uart_id: disp_uart
  brightness: 4

number:
  - platform: template
    name: Clock Brightness
    icon: mdi:brightness-6
    # 0 = brightest, 15 = off (the display's own scale).
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 4
    set_action:
      - lambda: id(clock_display).set_brightness((uint8_t) x);

script:
  # Enable the amp only after the I2S speaker is running, so the amp starts with its clocks present.
  - id: amp_on_after_clocks
    mode: single
    then:
      - if:
          condition:
            switch.is_off: amp
          then:
            - wait_until:
                condition:
                  speaker.is_playing: spk
                timeout: 1s
            - delay: 30ms
            - switch.turn_on: amp
  - id: show_clock
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int h = t.hour % 12;
          if (h == 0) h = 12;
          id(clock_display).show_time(h, t.minute);

  # Wi-Fi window: green = connected to Home Assistant, amber = Wi-Fi only, red = no Wi-Fi.
  # Lock window: green while the toddler lock is on.
  - id: update_status_leds
    mode: restart
    then:
      - lambda: |-
          uint8_t wifi;
          if (!wifi::global_wifi_component->is_connected()) wifi = hatch_status_led::COLOUR_RED;
          else if (api::global_api_server->is_connected()) wifi = hatch_status_led::COLOUR_GREEN;
          else wifi = hatch_status_led::COLOUR_AMBER;
          id(status_leds).set(hatch_status_led::WINDOW_WIFI, wifi);
          id(status_leds).set(hatch_status_led::WINDOW_LOCK,
                              id(toddler_lock).state ? hatch_status_led::COLOUR_GREEN : hatch_status_led::COLOUR_OFF);

hatch_status_led:
  id: status_leds

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Restart
  # Same chime the probe played (known to work): checks amp + I2S without the media pipeline.
  - platform: template
    name: Test Chime
    on_press:
      - rtttl.play: "beep:d=8,o=5,b=120:c6,e6,g6"
      - script.execute: amp_on_after_clocks
      - delay: 3s
      - if:
          condition:
            media_player.is_idle: player
          then:
            - switch.turn_off: amp
