# Hatch Rest (2nd gen, "RIoT" board) — ESPHome replacement, for the ESPHome Builder add-on.
#
# Copy this file into the Builder (New device -> skip, then paste it in), and add these to the Builder's Secrets:
#   wifi_ssid, wifi_password, fallback_ap_password, api_encryption_key
# Use the same api_encryption_key the device was last flashed with: it secures both the API and OTA, so the
# Builder's first wireless install only works if it matches (and Home Assistant keeps its pairing).
#
# Both the config and the custom components come from GitHub. `main` follows every push; for a device you rely on,
# pin a tag or commit in both the package URL (`@<ref>`) and `ref:` below.
#
# To customise, add keys after `packages:`; they override the base (e.g. substitutions, or a `wifi:` block with
# `manual_ip:` for a static address).

substitutions:
  # Keep `hatch-rest` to adopt a unit already running this firmware.
  name: hatch-rest
  friendly_name: Hatch Rest

external_components:
  - source:
      type: git
      url: https://github.com/w1ll1am23/hatch-riot-re
      ref: main
      path: esphome/components
    components: [hatch_expander, hatch_display, hatch_status_led]
    refresh: 1d

packages:
  hatch_rest: github://w1ll1am23/hatch-riot-re/esphome/hatch-rest-base.yaml@main
