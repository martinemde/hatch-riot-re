# DEVELOPMENT ONLY. Power parity is incomplete. DO NOT FLASH ON A HATCH.
# Private build example: provide your own git-ignored secrets.yaml.
# This is not a universal prebuilt image; each device needs its own encryption key.
substitutions:
  name: hatch-plus-example
  friendly_name: Hatch Plus Example
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  comment: 'UNVALIDATED Plus development build: power management incomplete; DO NOT FLASH HATCH'
  on_boot:
  - priority: -100
    then:
    - script.execute: update_display
    - lambda: id(sd_cache_source).set_enabled(id(sd_cache_enabled).state);
esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true
psram:
  mode: quad
  speed: 80MHz
logger: null
api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s
  actions:
  - action: send_text
    variables:
      message: string
    then:
    - lambda: id(clock_display).show_scrolling_text_once(message);
  - action: store_preset
    variables:
      index: int
      name: string
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).store_preset(index, name);
        error_message: Preset save failed; use slot 0-9 and check device log
  - action: apply_preset
    variables:
      index: int
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).apply_preset(index);
        error_message: Preset apply failed; use a saved slot 0-9 and check device log
  - action: favorite_capture
    variables:
      index: int
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).capture(index);
        error_message: Favorite operation failed; check device log
  - action: favorite_configure
    variables:
      index: int
      uri: string
      repeat: bool
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).configure_favorite(index, uri, repeat);
        error_message: Favorite operation failed; check device log
  - action: favorite_play
    variables:
      index: int
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).play(index);
        error_message: Favorite operation failed; check device log
  - action: favorite_erase
    variables:
      index: int
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).erase(index);
        error_message: Favorite operation failed; check device log
  - action: favorite_next
    variables: {}
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).next();
        error_message: Favorite operation failed; check device log
  - action: favorite_previous
    variables: {}
    then:
    - api.respond:
        success: !lambda |-
          return id(hatch_controller).previous();
        error_message: Favorite operation failed; check device log
  - action: library_page
    variables:
      directory: string
      offset: int
      limit: int
    then:
    - api.respond:
        data: !lambda |-
          if (offset < 0 || limit < 1 || limit > 64) {
            root["error"] = "Invalid offset or limit";
            return;
          }
          auto page = id(sd_cache_source).library_page(directory, offset, limit);
          root["error"] = page.error;
          root["next_offset"] = page.next_offset;
          root["has_more"] = page.has_more;
          auto entries = root["entries"].to<JsonArray>();
          for (const auto &entry : page.entries) {
            auto item = entries.add<JsonObject>();
            item["name"] = entry.name;
            item["uri"] = entry.uri;
            item["is_directory"] = entry.is_directory;
            item["size_bytes"] = entry.size_bytes;
          }
ota:
- platform: esphome
  encryption: {}
safe_mode: null
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
time:
- platform: homeassistant
  id: ha_time
  on_time_sync:
  - script.execute: update_display
  on_time:
  - seconds: 0
    then:
    - script.execute: update_display
hatch_expander:
- id: io_exp
  sda: GPIO0
  scl: GPIO22
  address: 88
  frequency: 50kHz
  interrupt_pin: GPIO34
output:
- platform: template
  id: clock_brightness_output
  type: float
  write_action:
  - lambda: |-
      const auto level = static_cast<uint8_t>(roundf(state * 15.0f));
      id(clock_display).set_brightness(15 - level);
- platform: ledc
  id: ch_r
  channel: 0
  pin:
    number: GPIO5
    ignore_strapping_warning: true
  frequency: 19500Hz
  max_power: 50%
- platform: ledc
  id: ch_g
  channel: 1
  pin: GPIO18
  frequency: 19500Hz
  max_power: 37.5%
- platform: ledc
  id: ch_b
  channel: 2
  pin: GPIO19
  frequency: 19500Hz
  max_power: 25%
- platform: ledc
  id: ch_w
  channel: 3
  pin: GPIO4
  frequency: 19500Hz
  max_power: 25%
light:
- platform: monochromatic
  id: clock_light
  name: Clock Display
  icon: mdi:clock-digital
  output: clock_brightness_output
  gamma_correct: 1.0
  default_transition_length: 0s
  restore_mode: RESTORE_DEFAULT_ON
  initial_state:
    brightness: 0.733333
- platform: rgbw
  id: night_light
  icon: mdi:lightbulb-night
  name: Night Light
  red: ch_r
  green: ch_g
  blue: ch_b
  white: ch_w
  color_interlock: false
  restore_mode: RESTORE_DEFAULT_OFF
  default_transition_length: 1s
i2s_audio:
- id: i2s_out
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
speaker:
- platform: i2s_audio
  id: spk
  i2s_audio_id: i2s_out
  dac_type: external
  i2s_dout_pin: GPIO21
  channel: mono
  bits_per_sample: 16bit
  sample_rate: 48000
sendspin:
  id: sendspin_hub
media_source:
- platform: sd_cache
  id: sd_cache_source
  power_pin:
    hatch_expander: io_exp
    number: 9
    mode: output
  library_enabled: true
- platform: audio_http
  id: http_source
- platform: sendspin
  id: sendspin_source
media_player:
- platform: speaker_source
  id: player
  name: Speaker
  volume_initial: 0.3
  media_pipeline:
    speaker: spk
    sources:
    - sd_cache_source
    - http_source
    - sendspin_source
    format: NONE
select:
- platform: template
  id: stock_sound
  name: Stock Sound
  icon: mdi:music-note
  optimistic: true
  restore_value: true
  initial_option: None
  options:
  - None
  - Heartbeat
  - Stream
  - Pink Noise
  - Dryer
  - Ocean
  - Wind
  - Rain
  - Birds
  - Crickets
  - Brahms
  - Twinkle
  - Rockabye
  set_action:
  - lambda: |-
      // Local playback must release Sendspin even when its remote group is paused.
      id(sendspin_hub).disconnect_from_server(sendspin::SendspinGoodbyeReason::USER_REQUEST);
      if (x == "None") {
        id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP).perform();
        return;
      }
      std::string filename;
      if (x == "Heartbeat") filename = "001_heartbeat.wav";
      if (x == "Stream") filename = "002_waterstreamsmallclose16.wav";
      if (x == "Pink Noise") filename = "003_pinknoise16.wav";
      if (x == "Dryer") filename = "004_dryerclothes16.wav";
      if (x == "Ocean") filename = "005_oceanwaves16.wav";
      if (x == "Wind") filename = "006_wind16.wav";
      if (x == "Rain") filename = "007_rain16.wav";
      if (x == "Birds") filename = "009_birdschorus16.wav";
      if (x == "Crickets") filename = "010_crickets16.wav";
      if (x == "Brahms") filename = "011_brahms16.wav";
      if (x == "Twinkle") filename = "013_twinkle16.wav";
      if (x == "Rockabye") filename = "014_rockabye16.wav";
      if (filename.empty()) return;
      id(loop_sound).turn_on();
      id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_ONE).perform();
      id(player).make_call().set_media_url("hatch-library:///Rest_Sounds/wav/" + filename).perform();
switch:
- platform: template
  id: loop_sound
  name: Loop Sound
  icon: mdi:repeat
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  on_turn_on:
  - lambda: id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_ONE).perform();
  on_turn_off:
  - lambda: id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_REPEAT_OFF).perform();
- platform: gpio
  id: touch_enable
  icon: mdi:gesture-tap
  internal: true
  restore_mode: ALWAYS_ON
  pin:
    hatch_expander: io_exp
    number: 5
    mode: output
- platform: template
  id: sd_cache_enabled
  name: SD Card Cache
  icon: mdi:sd
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - lambda: id(sd_cache_source).set_enabled(true);
  on_turn_off:
  - lambda: id(sd_cache_source).set_enabled(false);
- platform: template
  id: show_clock
  name: Show Clock
  icon: mdi:clock-digital
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
  on_turn_on:
  - script.execute: update_display
  on_turn_off:
  - script.execute: update_display
- platform: template
  id: toddler_lock
  icon: mdi:lock
  name: Toddler Lock
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - lambda: id(hatch_controller).set_child_lock(true);
  on_turn_off:
  - lambda: id(hatch_controller).set_child_lock(false);
binary_sensor:
- platform: gpio
  id: btn_volume_up
  entity_category: diagnostic
  icon: mdi:volume-plus
  name: Volume Up Button
  pin:
    hatch_expander: io_exp
    number: 0
    mode: input
    inverted: true
  filters:
  - delayed_on: 30ms
  on_press:
  - lambda: id(hatch_controller).button_event("volume_up", true);
  on_release:
  - lambda: id(hatch_controller).button_event("volume_up", false);
- platform: gpio
  id: btn_brightness_up
  entity_category: diagnostic
  icon: mdi:brightness-7
  name: Brightness Up Button
  pin:
    hatch_expander: io_exp
    number: 1
    mode: input
    inverted: true
  filters:
  - delayed_on: 30ms
  on_press:
  - lambda: id(hatch_controller).button_event("brightness_up", true);
  on_release:
  - lambda: id(hatch_controller).button_event("brightness_up", false);
- platform: gpio
  id: btn_night_light
  entity_category: diagnostic
  icon: mdi:lightbulb-night
  name: Night Light Button
  pin:
    hatch_expander: io_exp
    number: 2
    mode: input
    inverted: true
  filters:
  - delayed_on: 30ms
  on_press:
  - lambda: id(hatch_controller).button_event("night_light", true);
  on_release:
  - lambda: id(hatch_controller).button_event("night_light", false);
- platform: gpio
  id: btn_volume_down
  entity_category: diagnostic
  icon: mdi:volume-minus
  name: Volume Down Button
  pin:
    hatch_expander: io_exp
    number: 3
    mode: input
    inverted: true
  filters:
  - delayed_on: 30ms
  on_press:
  - lambda: id(hatch_controller).button_event("volume_down", true);
  on_release:
  - lambda: id(hatch_controller).button_event("volume_down", false);
- platform: gpio
  id: btn_brightness_down
  entity_category: diagnostic
  icon: mdi:brightness-5
  name: Brightness Down Button
  pin:
    hatch_expander: io_exp
    number: 4
    mode: input
    inverted: true
  filters:
  - delayed_on: 30ms
  on_press:
  - lambda: id(hatch_controller).button_event("brightness_down", true);
  on_release:
  - lambda: id(hatch_controller).button_event("brightness_down", false);
- platform: gpio
  id: touch
  entity_category: diagnostic
  icon: mdi:gesture-tap
  name: Touch
  pin: GPIO33
  filters:
  - delayed_on: 50ms
  - delayed_off: 100ms
  on_press:
  - lambda: id(hatch_controller).button_event("touch", true);
  on_release:
  - lambda: id(hatch_controller).button_event("touch", false);
- platform: gpio
  id: btn_bottom
  entity_category: diagnostic
  icon: mdi:gesture-tap-button
  name: Bottom Button
  pin:
    number: GPIO36
    inverted: true
  on_press:
  - lambda: id(hatch_controller).button_event("bottom", true);
  on_release:
  - lambda: id(hatch_controller).button_event("bottom", false);
uart:
  id: disp_uart
  tx_pin: GPIO27
  baud_rate: 19200
  data_bits: 8
  parity: ODD
  stop_bits: 1
hatch_display:
  id: clock_display
  uart_id: disp_uart
  brightness: 4
text:
- platform: template
  id: display_text
  name: Display Text
  icon: mdi:form-textbox
  mode: text
  max_length: 128
  optimistic: true
  restore_value: true
  on_value:
  - script.execute: update_display
script:
- id: update_display
  mode: queued
  then:
  - lambda: "if (!id(show_clock).state) {\n  id(clock_display).show_scrolling_text(id(display_text).state);\n  return;\n}\n\
      auto t = id(ha_time).now();\nif (!t.is_valid()) return;\nint h = t.hour % 12;\nif (h == 0) h = 12;\nid(clock_display).show_time(h,\
      \ t.minute);"
sensor:
- platform: template
  name: Current Favorite
  icon: mdi:star
  accuracy_decimals: 0
  update_interval: 1s
  lambda: return id(hatch_controller).current_favorite();
- platform: wifi_signal
  name: Wi-Fi Signal
  icon: mdi:wifi
  entity_category: diagnostic
  update_interval: 60s
- platform: uptime
  name: Uptime
  icon: mdi:timer-outline
  entity_category: diagnostic
- platform: template
  name: SD Cache Used
  icon: mdi:micro-sd
  device_class: data_size
  state_class: measurement
  unit_of_measurement: MB
  accuracy_decimals: 1
  entity_category: diagnostic
  update_interval: 60s
  lambda: return id(sd_cache_source).cache_used_mb();
- platform: template
  name: SD Cache Files
  icon: mdi:file-music
  state_class: measurement
  accuracy_decimals: 0
  entity_category: diagnostic
  update_interval: 60s
  lambda: return id(sd_cache_source).cache_files();
button:
- platform: template
  name: Clear SD Cache
  icon: mdi:delete-sweep
  entity_category: config
  on_press:
  - lambda: id(sd_cache_source).clear_cache();
external_components:
- source:
    type: local
    path: components
  components:
  - hatch_expander
  - hatch_display
  - sd_cache
  - speaker_source
  - hatch_plus
  - hatch_plus_power
# Shared Plus peripheral owner (stock physical port1). Not a deployment claim.
i2c:
  id: plus_bus1
  sda: GPIO13
  scl: GPIO23
  scan: false
  frequency: 100kHz

hatch_plus_power:
  i2c_id: plus_bus1
  id: plus_power_diagnostics
  hatch_expander_id: io_exp
  acknowledge_experimental_power_risks: true
  # Charging/thermal/shutdown control is experimental and not hardware-safety approved.
  allow_control: false
  # Erases/programs GreenPAK NVM on mismatch; requires separate recovery approval.
  allow_nvm_programming: false
  light_id: night_light
  media_player_id: player
  speaker_id: spk
  display_id: clock_display
  pwm_channels: [0, 1, 2, 3]
  battery_percent:
    name: Battery
  battery_report_age:
    name: Battery Report Age
  battery_report_accepted:
    name: Battery Report Accepted
  owner_fault:
    name: Power Owner Fault
  power_status:
    name: Power Status
  external_power_present:
    name: External Power Present
  wireless_voltage_present:
    name: Wireless Voltage Present
  charge_enable_logic:
    name: Charge Enable Logic
hatch_plus:
  id: hatch_controller
  light_id: night_light
  media_player_id: player
  presets:
    stock_sound_id: stock_sound
    loop_switch_id: loop_sound
    clock_switch_id: show_clock
    clock_light_id: clock_light
    text_id: display_text
    display_id: clock_display
  buttons:
  # Use tap: none (or another action) to disable top-touch preset cycling.
  - name: touch
    tap: next
    hold: stop
  - name: volume_up
    tap: volume_up
  - name: volume_down
    tap: volume_down
  # Move manage_preset to another button, or use none for API-only storage.
  - name: night_light
    tap: toggle_light
    hold: manage_preset
  - name: brightness_up
    tap: brightness_up
  - name: brightness_down
    tap: brightness_down
  - name: bottom
    tap: previous
    hold: none
  on_button:
  - homeassistant.event:
      event: esphome.hatch_button
      data:
        device: ${name}
        button: !lambda |-
          return button;
        gesture: !lambda |-
          return gesture;
