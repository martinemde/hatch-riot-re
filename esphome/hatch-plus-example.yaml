# Local checkout example. For ESPHome Builder, use hatch-plus-builder.yaml.
substitutions:
  name: hatch-plus
  friendly_name: Hatch Rest Plus
  # Enables the night light and amplifier, plus experimental charging and shutdown.
  enable_experimental_power_control: "false"
  # Set to "false" to keep events but let Home Assistant handle button actions.
  # enable_local_button_actions: "false"

packages:
  hatch_rest_plus: !include hatch-plus-base.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key
