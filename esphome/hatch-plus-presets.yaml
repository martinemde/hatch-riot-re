# Local favorites and full presets; included by the Rest+ package.
hatch_scenes:
  id: scenes
  light_id: night_light
  media_player_id: player
  presets:
    stock_sound_id: stock_sound
    loop_switch_id: loop_sound
    clock_switch_id: show_clock
    clock_light_id: clock_light
    text_id: display_text
    display_id: clock_display

select:
  # These labels are stored in full presets. The original WAVs live on the stock SD card.
  - platform: template
    id: stock_sound
    name: Stock Sound
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    initial_option: None
    options:
      - None
      - Heartbeat
      - Stream
      - Pink Noise
      - Dryer
      - Ocean
      - Wind
      - Rain
      - Birds
      - Crickets
      - Brahms
      - Twinkle
      - Rockabye
    set_action:
      - lambda: |-
          if (x == "None") {
            id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP).perform();
            return;
          }
          std::string filename;
          if (x == "Heartbeat") filename = "001_heartbeat.wav";
          if (x == "Stream") filename = "002_waterstreamsmallclose16.wav";
          if (x == "Pink Noise") filename = "003_pinknoise16.wav";
          if (x == "Dryer") filename = "004_dryerclothes16.wav";
          if (x == "Ocean") filename = "005_oceanwaves16.wav";
          if (x == "Wind") filename = "006_wind16.wav";
          if (x == "Rain") filename = "007_rain16.wav";
          if (x == "Birds") filename = "009_birdschorus16.wav";
          if (x == "Crickets") filename = "010_crickets16.wav";
          if (x == "Brahms") filename = "011_brahms16.wav";
          if (x == "Twinkle") filename = "013_twinkle16.wav";
          if (x == "Rockabye") filename = "014_rockabye16.wav";
          if (filename.empty()) return;
          // Start stock sounds looping; hatch_scenes restores the saved loop setting on recall.
          id(loop_sound).turn_on();
          id(player).make_call().set_media_url("hatch-library:///Rest_Sounds/wav/" + filename).perform();

switch:
  - platform: template
    id: loop_sound
    name: Loop Sound
    entity_category: config
    icon: mdi:repeat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - media_player.repeat_one: player
    turn_off_action:
      - media_player.repeat_off: player
  - platform: template
    id: show_clock
    name: Show Clock
    entity_category: config
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: update_clock

text:
  - platform: template
    id: display_text
    name: Display Text
    entity_category: config
    icon: mdi:form-textbox
    mode: text
    max_length: 128
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_clock

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lambda: |-
          if (!id(show_clock).state) {
            id(clock_display).show_scrolling_text(id(display_text).state);
            return;
          }
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            const int hour = now.hour % 12;
            id(clock_display).show_time(hour == 0 ? 12 : hour, now.minute);
          } else {
            id(clock_display).show_text("");
          }

sensor:
  - platform: template
    name: Current Favorite
    entity_category: diagnostic
    icon: mdi:star
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(scenes).current_favorite();

api:
  actions:
    - action: store_preset
      variables:
        index: int
        name: string
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).store_preset(index, name);
            error_message: Preset save failed; use slot 0-9 and check device log
    - action: apply_preset
      variables:
        index: int
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).apply_preset(index);
            error_message: Preset apply failed; use a saved slot 0-9 and check device log
    - action: favorite_capture
      variables:
        index: int
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).capture(index);
            error_message: Favorite operation failed; check device log
    - action: favorite_configure
      variables:
        index: int
        uri: string
        repeat: bool
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).configure_favorite(index, uri, repeat);
            error_message: Favorite operation failed; check device log
    - action: favorite_play
      variables:
        index: int
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).play(index);
            error_message: Favorite operation failed; check device log
    - action: favorite_erase
      variables:
        index: int
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).erase(index);
            error_message: Favorite operation failed; check device log
    - action: favorite_next
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).next();
            error_message: Favorite operation failed; check device log
    - action: favorite_previous
      then:
        - api.respond:
            success: !lambda |-
              return id(scenes).previous();
            error_message: Favorite operation failed; check device log
