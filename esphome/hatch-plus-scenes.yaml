# Scenes, stock sounds, and clock settings; included by the Rest+ package.
hatch_scenes:
  id: scenes
  light_id: night_light
  media_player_id: player
  display_id: clock_display
  current_scene:
    name: Current Scene

select:
  # The original WAVs live on the stock SD card.
  - platform: template
    id: stock_sound
    name: Stock Sound
    icon: mdi:music-note
    optimistic: true
    restore_value: true
    initial_option: None
    options:
      - None
      - Heartbeat
      - Stream
      - Pink Noise
      - Dryer
      - Ocean
      - Wind
      - Rain
      - Birds
      - Crickets
      - Brahms
      - Twinkle
      - Rockabye
    set_action:
      - lambda: |-
          if (x == "None") {
            id(player).make_call().set_command(media_player::MEDIA_PLAYER_COMMAND_STOP).perform();
            return;
          }
          std::string filename;
          if (x == "Heartbeat") filename = "001_heartbeat.wav";
          if (x == "Stream") filename = "002_waterstreamsmallclose16.wav";
          if (x == "Pink Noise") filename = "003_pinknoise16.wav";
          if (x == "Dryer") filename = "004_dryerclothes16.wav";
          if (x == "Ocean") filename = "005_oceanwaves16.wav";
          if (x == "Wind") filename = "006_wind16.wav";
          if (x == "Rain") filename = "007_rain16.wav";
          if (x == "Birds") filename = "009_birdschorus16.wav";
          if (x == "Crickets") filename = "010_crickets16.wav";
          if (x == "Brahms") filename = "011_brahms16.wav";
          if (x == "Twinkle") filename = "013_twinkle16.wav";
          if (x == "Rockabye") filename = "014_rockabye16.wav";
          if (filename.empty()) return;
          // Stock sounds start looping.
          id(loop_sound).turn_on();
          id(player).make_call().set_media_url("hatch-library:///Rest_Sounds/wav/" + filename).perform();

switch:
  - platform: template
    id: loop_sound
    name: Loop Sound
    entity_category: config
    icon: mdi:repeat
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - media_player.repeat_one: player
    turn_off_action:
      - media_player.repeat_off: player
  - platform: template
    id: show_clock
    name: Show Clock
    entity_category: config
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: update_clock

text:
  - platform: template
    id: display_text
    name: Display Text
    entity_category: config
    icon: mdi:form-textbox
    mode: text
    max_length: 128
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_clock

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lambda: |-
          if (!id(show_clock).state) {
            id(clock_display).show_scrolling_text(id(display_text).state);
            return;
          }
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            const int hour = now.hour % 12;
            id(clock_display).show_time(hour == 0 ? 12 : hour, now.minute);
          } else {
            id(clock_display).show_text("");
          }

api:
  actions:
    # Scenes by slot number (1-9).
    - action: save_scene
      variables:
        slot: int
      then:
        - hatch_scenes.save:
            slot: !lambda return slot;
    - action: load_scene
      variables:
        slot: int
      then:
        - hatch_scenes.load: !lambda return slot;
    - action: delete_scene
      variables:
        slot: int
      then:
        - hatch_scenes.delete:
            slot: !lambda return slot;
    - action: next_scene
      then:
        - hatch_scenes.next: scenes
    - action: previous_scene
      then:
        - hatch_scenes.previous: scenes
