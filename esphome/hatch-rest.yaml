# Hatch Rest (2nd gen, "RIoT" board) — ESPHome replacement, local development build.
#
# Everything device-specific lives in hatch-rest-base.yaml; this file only adds the local components.
# For the ESPHome Builder add-on, use hatch-rest-builder.yaml instead.
#
# Flash ONLY after ../scripts/backup.sh has made and verified a full-flash backup.

substitutions:
  name: hatch-rest
  friendly_name: Hatch Rest

external_components:
  - source:
      type: local
      path: components
    components: [hatch_expander, hatch_display, hatch_status_led, sd_cache, speaker_source]

packages:
  hatch_rest: !include hatch-rest-base.yaml
