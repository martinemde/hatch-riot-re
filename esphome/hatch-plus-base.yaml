# Hatch Rest+ 2nd gen (HBRESTPLUS2 / RIoT+). The node config owns credentials.
packages:
  controls: !include hatch-plus-controls.yaml
  scenes: !include hatch-plus-scenes.yaml

external_components:
  - source:
      type: git
      url: https://github.com/w1ll1am23/hatch-riot-re
      ref: 6936266e292522c9a95ba9be11a3a7db70d32449
      path: esphome/components
    components: [hatch_buttons, hatch_display, hatch_plus_power, sd_cache]
  # Keep these on their own review branches until #7 and #11 are upstream.
  - source:
      type: git
      url: https://github.com/martinemde/hatch-riot-re
      ref: 15b815978de0b014944c7200d6f01a0baa498603
      path: esphome/components
    components: [hatch_accelerometer, hatch_expander]
  - source:
      type: git
      url: https://github.com/martinemde/hatch-riot-re
      ref: b1b0800eff7d6c12a8c649f842ff686ed4f3b5cc
      path: esphome/components
    components: [hatch_scenes, speaker_source]

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

logger:

api:
  reboot_timeout: 0s
  actions:
    - action: send_text
      variables:
        message: string
      then:
        - lambda: id(clock_display).show_scrolling_text_once(message);

safe_mode:

wifi:
  # Wi-Fi power saving can interrupt Sendspin.
  power_save_mode: none
  reboot_timeout: 0s

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true

psram:
  mode: quad
  speed: 80MHz

hatch_expander:
  - id: io_exp
    sda: GPIO0
    scl: GPIO22
    address: 0x58
    frequency: 50kHz
    interrupt_pin: GPIO34

# GreenPAK and wireless power receiver use external pull-ups.
i2c:
  id: plus_bus1
  sda: GPIO13
  scl: GPIO23
  sda_pullup_enabled: false
  scl_pullup_enabled: false
  scan: false
  frequency: 100kHz

uart:
  id: disp_uart
  tx_pin: GPIO27
  baud_rate: 19200
  data_bits: 8
  parity: ODD
  stop_bits: 1

hatch_display:
  id: clock_display
  uart_id: disp_uart
  brightness: 4

output:
  - platform: template
    id: clock_brightness_output
    type: float
    write_action:
      - lambda: |-
          const auto level = static_cast<uint8_t>(roundf(state * 15.0f));
          id(clock_display).set_brightness(15 - level);
  - platform: ledc
    id: ch_r
    channel: 0
    pin:
      number: GPIO5
      ignore_strapping_warning: true
    frequency: 19500Hz
    max_power: 50%
  - platform: ledc
    id: ch_g
    channel: 1
    pin: GPIO18
    frequency: 19500Hz
    max_power: 37.5%
  - platform: ledc
    id: ch_b
    channel: 2
    pin: GPIO19
    frequency: 19500Hz
    max_power: 25%
  - platform: ledc
    id: ch_w
    channel: 3
    pin: GPIO4
    frequency: 19500Hz
    max_power: 25%

light:
  - platform: monochromatic
    id: clock_light
    name: Clock Display
    icon: mdi:clock-digital
    output: clock_brightness_output
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      brightness: 73.3333%
  - platform: rgbw
    id: night_light
    icon: mdi:lightbulb-night
    name: Night Light
    red: ch_r
    green: ch_g
    blue: ch_b
    white: ch_w
    color_interlock: false
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

switch:
  - platform: gpio
    id: touch_enable
    icon: mdi:gesture-tap
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      hatch_expander: io_exp
      number: 5
      mode: output

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO21
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000

sendspin:
  id: sendspin_hub

media_source:
  - platform: audio_http
    id: http_source
  - platform: sendspin
    id: sendspin_source
  - platform: sd_cache
    id: sd_cache_source
    power_pin:
      hatch_expander: io_exp
      number: 9
      mode: output
    library_enabled: true

media_player:
  - platform: speaker_source
    id: player
    name: Speaker
    volume_initial: 0.3
    media_pipeline:
      speaker: spk
      sources:
        - sd_cache_source
        - http_source
        - sendspin_source
      format: NONE
    on_play_uri:
      - lambda: |-
          if (x.rfind("sendspin://", 0) != 0 &&
              id(sendspin_source).get_state() != media_source::MediaSourceState::IDLE) {
            id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::STOP);
          }

# The DA213/MSA311 uses the GPIO0/22 expander bus, not I2C1 on GPIO13/23.
hatch_accelerometer:
  id: accelerometer
  hatch_expander_id: io_exp
  allow_initialization: true
  tilt_angle:
    name: Tilt Angle
    filters:
      - delta: 2.0
  upright:
    name: Upright

hatch_plus_power:
  i2c_id: plus_bus1
  id: plus_power
  hatch_expander_id: io_exp
  allow_control: true
  allow_nvm_programming: false
  light_id: night_light
  media_player_id: player
  speaker_id: spk
  display_id: clock_display
  pwm_channels: [0, 1, 2, 3]
  battery_percent:
    name: Battery
    entity_category: ""
  external_power_present:
    id: hatch_plug_power
    name: External Power Present
  wireless_voltage_present:
    id: hatch_wireless_power
    name: Wireless Voltage Present

text_sensor:
  - platform: template
    name: Power Source
    icon: mdi:power-plug
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (!id(hatch_wireless_power).has_state() || !id(hatch_plug_power).has_state()) return {"unknown"};
      if (id(hatch_wireless_power).state) return {"base"};
      if (id(hatch_plug_power).state) return {"plug"};
      return {"battery"};
